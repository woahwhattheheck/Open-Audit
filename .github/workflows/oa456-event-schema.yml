name: OpenAPI event response formatting
on:
  push:
    branches: [validation/oa456-event-schema-larch-20261004]
permissions:
  contents: read
jobs:
  format-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EVIDENCE: ${{ runner.temp }}/oa456-format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the same locked tools
        run: npm ci --no-audit --no-fund
      - name: Format and prove the emitted test is unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          FILE=lib/openapi/__tests__/event-responses.test.ts
          cp "$FILE" "$EVIDENCE/before.ts"
          npm exec -- prettier --write "$FILE"
          npm exec -- prettier --check lib/openapi/schemas.ts "$FILE"
          cp "$FILE" "$EVIDENCE/event-responses.test.ts"
          node <<'NODE' | tee "$EVIDENCE/equivalence.txt"
          const fs = require('fs');
          const ts = require('typescript');
          const crypto = require('crypto');
          const options = { compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext, removeComments: true } };
          const root = process.env.EVIDENCE;
          const before = ts.transpileModule(fs.readFileSync(root + '/before.ts','utf8'), options).outputText;
          const after = ts.transpileModule(fs.readFileSync(root + '/event-responses.test.ts','utf8'), options).outputText;
          if (before !== after) throw new Error('Formatting changed emitted JavaScript');
          console.log('PASS: identical emitted JavaScript');
          console.log('Emitted SHA256: ' + crypto.createHash('sha256').update(after).digest('hex'));
          console.log('TypeScript ' + ts.version + '; Prettier ' + require('prettier/package.json').version);
          NODE
          git diff -- lib/openapi/__tests__/event-responses.test.ts | tee "$EVIDENCE/format.patch"
          git diff --exit-code -- lib/openapi/schemas.ts package.json package-lock.json
          git diff --check
          git hash-object lib/openapi/schemas.ts "$FILE" | tee "$EVIDENCE/source-blobs.txt"
          sha256sum "$EVIDENCE"/* > "$RUNNER_TEMP/oa456-format.sha256"
          cat "$RUNNER_TEMP/oa456-format.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oa456-format-only
          path: |
            ${{ runner.temp }}/oa456-format
            ${{ runner.temp }}/oa456-format.sha256
          if-no-files-found: warn
          retention-days: 7
